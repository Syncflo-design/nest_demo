[project]
name = "nest_demo"
authors = [{ name = "Syncflo", email = "ops@syncflo.co.za" }]
description = "Demo-site switch: pick a business type and the demo login sees only what suits that prospect."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "nest_demo"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
